<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIRUJUK</title>
<style>
:root{--bg:#fff6fa;--card:#fff;--tx:#2a1b24;--mut:#7a6671;--line:#f3dfe8;--pri:#c2255c;--pri2:#ffe8f1;--warn:#b54708;--warnbg:#fef0c7;--info:#175cd3;--infobg:#e0ecff;--ok:#067647;--okbg:#d1fadf;--bad:#b42318;--badbg:#fee4e2}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--card:#1a212b;--tx:#e8edf3;--mut:#9aa6b5;--line:#2a3441;--pri:#e64980;--pri2:#4a1630;--warn:#fdb022;--warnbg:#3b2a0a;--info:#84adff;--infobg:#14284d;--ok:#6ce9a6;--okbg:#0f3322;--bad:#fda29b;--badbg:#431511}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:76px}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
header b{font-size:16px}header small{display:block;opacity:.85;font-size:12px}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:13px}
main{max-width:980px;margin:0 auto;padding:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:12px 2px;font-size:12px;font-weight:600}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
h2{margin:6px 0 12px;font-size:18px}h3{margin:18px 0 8px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat span{display:block;color:var(--mut);font-size:12px}.stat b{font-size:20px}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:70px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.bad{background:var(--bad);color:#fff}.btn.sm{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}.row .btn{flex:0 0 auto}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.b-warn{background:var(--warnbg);color:var(--warn)}.b-info{background:var(--infobg);color:var(--info)}.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--badbg);color:var(--bad)}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item small{color:var(--mut)}.item .r{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--mut);font-size:12px}td.n,th.n{text-align:right}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;font-weight:600}.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.msg{padding:10px 12px;border-radius:8px;margin:8px 0;font-size:14px}.msg.err{background:var(--badbg);color:var(--bad)}.msg.ok{background:var(--okbg);color:var(--ok)}.msg.inf{background:var(--infobg);color:var(--info)}
.empty{color:var(--mut);text-align:center;padding:24px 0}
dialog{border:0;border-radius:14px;padding:16px;width:min(560px,94vw);background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.45)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:20;max-width:90vw}
.login{max-width:380px;margin:8vh auto 0}
.login .tabs{margin-top:10px}
.pin{font-size:22px;font-weight:800;letter-spacing:4px}
.muted{color:var(--mut)}.sp{height:8px}
.pw{position:relative}.pw input{padding-right:52px}
.pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:20px;line-height:1;padding:8px 10px;color:var(--mut);cursor:pointer}
/* Layar lebar (laptop/tablet landscape): menu pindah ke samping kiri */
@media (min-width:900px){
body{padding-bottom:0;padding-left:210px}
header{margin-left:-210px;z-index:8}
nav{top:56px;bottom:0;right:auto;width:210px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding-top:8px}
nav button{flex:0 0 auto;text-align:left;padding:14px 20px;font-size:14px}
nav button.on{background:var(--pri2);box-shadow:inset 4px 0 0 var(--pri)}
main{margin:0 auto;padding:20px 24px}
#toast{bottom:30px}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
/* ============ KONFIGURASI ============
   Ganti API_URL dengan URL Web App Apps Script (berakhiran /exec).
   INGAT: placeholder ini harus diisi ulang setiap kali file diganti penuh. */
const API_URL = 'https://script.google.com/macros/s/AKfycbzVksyBjrp5w902UkpOGKFCldKIrqLLh1y9rSaAEvrL9LyzSUaCMtSYgL6D6nI1s2yOgA/exec';

/* Identitas tampilan. Ganti sesuai pengguna; kosongkan instansi jika tidak ingin ditampilkan. */
const APP = { nama: 'SIRUJUK', instansi: '' };
document.title = APP.nama + (APP.instansi ? ' | ' + APP.instansi : '');

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n)||0);
const STAT = {BARU:['Menunggu verifikasi','b-warn'],TERVERIFIKASI:['Terverifikasi','b-info'],DIBAYAR:['Dibayar','b-ok'],DITOLAK:['Ditolak','b-bad']};
const badge = s => `<span class="badge ${(STAT[s]||['','']) [1]}">${esc((STAT[s]||[s])[0])}</span>`;
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const monthStart = () => todayStr().slice(0,8)+'01';

const S = { token:null, user:null, tab:null, meta:null, role:'PERUJUK' };
try { const t = JSON.parse(localStorage.getItem('sirujuk')||'null'); if (t) { S.token=t.token; S.user=t.user; } } catch(e){}

async function api(action, data){
  if (API_URL === 'API_URL') throw new Error('API_URL belum diisi di index.html');
  const res = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:S.token},data||{}))});
  const j = await res.json();
  if (!j.ok){ if (j.auth) logout(true); throw new Error(j.error||'Terjadi kesalahan'); }
  return j.data;
}
function toast(t){ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none',3200); }
function openDlg(html){ const d=$('#dlg'); d.innerHTML=html; if(!d.open) d.showModal(); return d; }
function closeDlg(){ const d=$('#dlg'); if(d.open) d.close(); }
function view(html){ $('#view').innerHTML = html; }
function loading(){ view('<div class="empty">Memuat…</div>'); }
function err(e){ return `<div class="msg err">${esc(e.message||e)}</div>`; }
async function getMeta(){ if(!S.meta) S.meta = await api('meta'); return S.meta; }
function opts(list, sel, blank){ return (blank?`<option value="">${esc(blank)}</option>`:'')+list.map(x=>{const v=typeof x==='object'?x.v:x, l=typeof x==='object'?x.l:x; return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(l)}</option>`}).join(''); }
/* Kolom PIN dengan tombol mata (tampilkan/sembunyikan) */
function pw(attrs){ return `<div class="pw"><input ${attrs} type="password" inputmode="numeric" maxlength="6" required><button type="button" class="eye" aria-label="Tampilkan PIN">👁</button></div>`; }
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('.eye'); if(!b) return;
  const i=b.parentNode.querySelector('input'); const show=i.type==='password';
  i.type=show?'text':'password'; b.textContent=show?'🙈':'👁'; b.setAttribute('aria-label',show?'Sembunyikan PIN':'Tampilkan PIN');
});
function fd(form){ const o={}; new FormData(form).forEach((v,k)=>o[k]=v); return o; }
function csv(rows, cols, name){
  const q = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const txt = '\ufeff'+[cols.map(c=>q(c[1])).join(',')].concat(rows.map(r=>cols.map(c=>q(r[c[0]])).join(','))).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})); a.download=name; a.click();
}

/* ============ LOGIN / SHELL ============ */
function logout(expired){
  S.token=null; S.user=null; S.meta=null; S.tab=null;
  try{ localStorage.removeItem('sirujuk'); }catch(e){}
  renderLogin(expired?'Sesi berakhir, silakan login ulang.':'');
}
function renderLogin(note){
  $('#app').innerHTML = `<div class="login"><div class="card">
  <h2 style="text-align:center">${esc(APP.nama)}</h2><div class="muted" style="text-align:center">Sistem Rujukan${APP.instansi?' • '+esc(APP.instansi):''}</div>
  <div class="tabs"><button type="button" id="rP" class="${S.role==='PERUJUK'?'on':''}">Perujuk</button><button type="button" id="rA" class="${S.role==='ADMIN'?'on':''}">Admin</button></div>
  ${note?`<div class="msg inf">${esc(note)}</div>`:''}<div id="lerr"></div>
  <form id="lf"><label>ID Pengguna</label><input name="id" autocomplete="username" required placeholder="${S.role==='ADMIN'?'contoh: admin':'contoh: P001'}">
  <label>PIN (6 angka)</label>${pw('name="pin" autocomplete="current-password"')}
  <div class="sp"></div><button class="btn" style="width:100%">Masuk</button></form>
  <p class="muted" style="font-size:12px;margin-bottom:0">Lupa PIN? Hubungi admin RS.</p></div></div>`;
  $('#rP').onclick=()=>{S.role='PERUJUK';renderLogin();};
  $('#rA').onclick=()=>{S.role='ADMIN';renderLogin();};
  $('#lf').onsubmit=async e=>{
    e.preventDefault(); const b=e.target.querySelector('button'); b.disabled=true; b.textContent='Memeriksa…';
    try{
      const d=await api('login',Object.assign(fd(e.target),{role:S.role}));
      S.token=d.token; S.user=d.user;
      try{ localStorage.setItem('sirujuk',JSON.stringify({token:d.token,user:d.user})); }catch(x){}
      renderShell();
    }catch(x){ $('#lerr').innerHTML=err(x); b.disabled=false; b.textContent='Masuk'; }
  };
}
const TABS = {
  PERUJUK:[['home','Beranda',vHome],['input','Input',vInput],['riwayat','Riwayat',vRiwayat],['bayar','Pembayaran',vBayarP],['profil','Profil',vProfil]],
  ADMIN:[['dash','Dashboard',aDash],['verif','Verifikasi',aVerif],['rujukan','Rujukan',aRujukan],['bayar','Bayar',aBayar],['rekap','Rekap',aRekap],['master','Master',aMaster]]
};
function renderShell(){
  const tabs=TABS[S.user.role];
  $('#app').innerHTML = `<header><div><b>${esc(APP.nama)}</b><small>${esc(S.user.nama)} • ${S.user.role==='ADMIN'?'Admin':'Perujuk'}</small></div><button id="lo">Keluar</button></header><main id="view"></main><nav id="nav"></nav>`;
  $('#lo').onclick=()=>logout();
  go(S.tab && tabs.some(t=>t[0]===S.tab) ? S.tab : tabs[0][0]);
}
function go(tab){
  S.tab=tab; const tabs=TABS[S.user.role];
  $('#nav').innerHTML = tabs.filter(t=>t[1]).map(t=>`<button class="${t[0]===tab?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>go(b.dataset.t));
  const fn = tabs.filter(t=>t[0]===tab)[0][2];
  loading(); Promise.resolve(fn()).catch(e=>view(err(e)));
  window.scrollTo(0,0);
}

/* ============ RUJUKAN: komponen bersama ============ */
function rujukanItem(r, admin){
  return `<div class="item"><div><b>${esc(r.nama_pasien)}</b> ${badge(r.status)}<br><small>${esc(r.tgl_kunjungan)} • ${esc(r.layanan)} • ${esc(r.jenis_pasien)}${admin?' • '+esc(r.nama_perujuk):''}</small>${r.alasan_tolak?`<br><small style="color:var(--bad)">Alasan: ${esc(r.alasan_tolak)}</small>`:''}</div><div class="r">${admin&&(r.status==='TERVERIFIKASI'||r.status==='DIBAYAR')?`<b>${rp(r.fee)}</b><br>`:''}<small>${esc(r.id)}</small></div></div>`;
}

function miripBadge(r){
  if(!r.mirip||!r.mirip.length) return '';
  return `<br><span class="badge b-warn">⚠ Mungkin pasien sama (${r.mirip.length})</span> <small>${esc(r.mirip.map(m=>m.nama_perujuk+' – '+(STAT[m.status]||[m.status])[0].toLowerCase()).join('; '))}</small>`;
}
function miripPanel(list){
  if(!list||!list.length) return '';
  return `<div class="msg" style="background:var(--warnbg);color:var(--warn)"><b>⚠ Kemungkinan pasien yang sama juga dirujuk perujuk lain</b>${list.map(m=>`<div style="margin-top:6px">${esc(m.nama_perujuk)} • ${esc(m.tgl_kunjungan)} • ${esc(m.layanan)} • ${esc((STAT[m.status]||[m.status])[0])} ${m.tingkat==='SAMA'?'<b>(layanan &amp; tanggal sama)</b>':''}<br><small>${esc(m.id)}</small></div>`).join('')}</div>`;
}

/* ============ PERUJUK ============ */
async function vHome(){
  const d = await api('home'); const s=d.ringkas;
  view(`<h2>Halo, ${esc(S.user.nama)}</h2>
  <div class="grid">
  <div class="stat"><span>Menunggu verifikasi</span><b>${s.BARU}</b></div>
  <div class="stat"><span>Terverifikasi</span><b>${s.TERVERIFIKASI}</b></div>
  <div class="stat"><span>Selesai (dibayar)</span><b>${s.DIBAYAR}</b></div>
  <div class="stat"><span>Ditolak</span><b>${s.DITOLAK}</b></div></div>
  <button class="btn" id="ni">+ Input rujukan baru</button>
  <h3>Rujukan terbaru</h3><div class="card">${d.terbaru.length?d.terbaru.map(r=>rujukanItem(r)).join(''):'<div class="empty">Belum ada rujukan</div>'}</div>`);
  $('#ni').onclick=()=>go('input');
}
async function vInput(){
  const m = await getMeta(); const admin = S.user.role==='ADMIN';
  view(`<h2>Input Rujukan</h2><div class="card"><div id="fe"></div><form id="rf">
  ${admin?`<label>Perujuk</label><select name="id_perujuk" required>${opts(m.perujuk.map(p=>({v:p.id,l:p.nama+' ('+p.kategori+')'})),'','Pilih perujuk…')}</select>`:''}
  <label>Nama pasien</label><input name="nama_pasien" required maxlength="100">
  <label>No. RM (jika ada)</label><input name="no_rm" maxlength="30" inputmode="numeric">
  <div class="row"><div><label>Jenis pasien</label><select name="jenis_pasien" required>${opts(m.jenis,'','Pilih…')}</select></div>
  <div><label>Layanan</label><select name="layanan" required>${opts(m.layanan,'','Pilih…')}</select></div></div>
  <label>Tanggal kunjungan</label><input name="tgl_kunjungan" type="date" required max="${todayStr()}" value="${todayStr()}">
  <label>Catatan (opsional)</label><textarea name="catatan" maxlength="300"></textarea>
  <div class="sp"></div><button class="btn">Kirim rujukan</button></form></div>`);
  $('#rf').onsubmit=async e=>{
    e.preventDefault(); const b=e.target.querySelector('button'); b.disabled=true;
    try{ const d=await api('submit',fd(e.target)); toast('Tersimpan: '+d.id); go(admin?'rujukan':'riwayat'); }
    catch(x){ $('#fe').innerHTML=err(x); b.disabled=false; window.scrollTo(0,0); }
  };
}
async function vRiwayat(){
  view(`<h2>Riwayat Rujukan</h2><div class="card"><select id="fs">${opts([{v:'BARU',l:'Menunggu'},{v:'TERVERIFIKASI',l:'Terverifikasi'},{v:'DIBAYAR',l:'Dibayar'},{v:'DITOLAK',l:'Ditolak'}],'','Semua status')}</select>
  <div class="row"><div><label>Dari tgl kunjungan</label><input id="rfd" type="date"></div><div><label>Sampai</label><input id="rtd" type="date"></div></div></div><div class="card" id="lst"></div>`);
  const load=async()=>{ $('#lst').innerHTML='<div class="empty">Memuat…</div>'; try{ const d=await api('rujukan',{status:$('#fs').value,from:$('#rfd').value,to:$('#rtd').value}); $('#lst').innerHTML=d.rows.length?d.rows.map(r=>rujukanItem(r)).join('')+(d.total>d.rows.length?`<div class="muted">Menampilkan ${d.rows.length} dari ${d.total}</div>`:''):'<div class="empty">Tidak ada data</div>'; }catch(x){ $('#lst').innerHTML=err(x); } };
  ['fs','rfd','rtd'].forEach(i=>$('#'+i).onchange=load); load();
}
async function vBayarP(){
  const rows = await api('pembayaran');
  view(`<h2>Riwayat Pembayaran</h2><div class="card">${rows.length?rows.map(p=>`<div class="item" data-p="${esc(p.id)}" style="cursor:pointer"><div><b>${esc(p.tgl_bayar)}</b><br><small>${esc(p.id)} • ${p.jumlah_rujukan} rujukan • ${esc(p.metode)}</small></div><div class="r"><b>${rp(p.total)}</b></div></div>`).join(''):'<div class="empty">Belum ada pembayaran</div>'}</div>`);
  document.querySelectorAll('[data-p]').forEach(el=>el.onclick=()=>detailBayar(el.dataset.p, S.user.role==='ADMIN'));
}
async function detailBayar(id, admin){
  openDlg('<div class="empty">Memuat…</div>');
  try{ const d=await api('rujukan',{id_pembayaran:id}); openDlg(`<h3 style="margin-top:0">Rincian ${esc(id)}</h3>${d.rows.map(r=>rujukanItem(r,admin)).join('')}<div class="sp"></div><button class="btn sec" onclick="closeDlg()">Tutup</button>`); }
  catch(x){ openDlg(err(x)+'<button class="btn sec" onclick="closeDlg()">Tutup</button>'); }
}
async function vProfil(){
  const p = await api('me');
  view(`<h2>Profil & Rekening</h2><div class="card"><b>${esc(p.nama)}</b><br><small class="muted">${esc(p.id)} • ${esc(p.kategori)}</small>
  <div id="pe"></div><form id="pf"><label>No. HP</label><input name="no_hp" value="${esc(p.no_hp)}" inputmode="tel">
  <label>Alamat</label><input name="alamat" value="${esc(p.alamat)}">
  <div class="row"><div><label>Bank</label><input name="bank" value="${esc(p.bank)}"></div><div><label>No. rekening</label><input name="no_rek" value="${esc(p.no_rek)}" inputmode="numeric"></div></div>
  <label>Atas nama</label><input name="atas_nama" value="${esc(p.atas_nama)}"><div class="sp"></div><button class="btn">Simpan</button></form></div>
  <div class="card"><h3 style="margin-top:0">Ganti PIN</h3><div id="ce"></div><form id="cf"><label>PIN lama</label>${pw('name="old_pin" autocomplete="current-password"')}
  <label>PIN baru (6 angka)</label>${pw('name="new_pin" autocomplete="new-password"')}<div class="sp"></div><button class="btn sec">Ganti PIN</button></form></div>`);
  $('#pf').onsubmit=async e=>{ e.preventDefault(); try{ await api('profileSave',fd(e.target)); toast('Profil tersimpan'); }catch(x){ $('#pe').innerHTML=err(x); } };
  $('#cf').onsubmit=async e=>{ e.preventDefault(); try{ await api('changePin',fd(e.target)); toast('PIN diganti'); e.target.reset(); $('#ce').innerHTML=''; }catch(x){ $('#ce').innerHTML=err(x); } };
}

/* ============ ADMIN ============ */
async function aDash(){
  const d = await api('dash'); const s=d.ringkas;
  view(`<h2>Dashboard</h2><div class="grid">
  <div class="stat"><span>Menunggu verifikasi</span><b>${s.BARU}</b></div>
  <div class="stat"><span>Fee belum dibayar</span><b>${rp(s.fee_terutang)}</b></div>
  <div class="stat"><span>Total fee dibayar</span><b>${rp(s.fee_dibayar)}</b></div>
  <div class="stat"><span>Terverifikasi (antre bayar)</span><b>${s.TERVERIFIKASI}</b></div></div>
  <h3>6 bulan terakhir (menurut tanggal kunjungan)</h3><div class="card tbl"><table><tr><th>Bulan</th><th class="n">Rujukan</th><th class="n">Fee</th></tr>${d.bulanan.map(b=>`<tr><td>${esc(b.bulan)}</td><td class="n">${b.rujukan}</td><td class="n">${rp(b.fee)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Belum ada data</td></tr>'}</table></div>

async function mTarif(){
  const [rows,m]=await Promise.all([api('tarifList'),getMeta()]);
  $('#mc').innerHTML=`<div class="msg inf">Jika beberapa aturan cocok, yang paling spesifik dipakai (layanan &gt; kategori perujuk &gt; jenis pasien). Fee dikunci saat rujukan diverifikasi, jadi perubahan tarif tidak mengubah fee yang sudah terverifikasi.</div><button class="btn" id="add" style="margin-bottom:10px">+ Tambah aturan fee</button><div class="card tbl"><table><tr><th>Layanan</th><th>Jenis pasien</th><th>Kategori perujuk</th><th>Fee</th><th>Status</th><th></th></tr>${rows.map(t=>`<tr><td>${esc(t.layanan)}</td><td>${esc(t.jenis_pasien)}</td><td>${esc(t.kategori)}</td><td>${t.tipe==='PERSEN'?t.nilai+'%':rp(t.nilai)}</td><td>${t.aktif?'Aktif':'Nonaktif'}</td><td><button class="btn sec sm" data-e="${esc(t.id)}">Ubah</button></td></tr>`).join('')}</table></div>`;
  $('#add').onclick=()=>formTarif(null,m);
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>formTarif(rows.filter(r=>r.id===b.dataset.e)[0],m));
}
function formTarif(t,m){
  const e=!!t; t=t||{layanan:'',jenis_pasien:'SEMUA',kategori:'SEMUA',tipe:'NOMINAL',nilai:'',aktif:true};
  openDlg(`<h3 style="margin-top:0">${e?'Ubah':'Tambah'} aturan fee</h3><div id="de"></div><form id="tf">
  <label>Layanan</label><input name="layanan" required list="ll" value="${esc(t.layanan)}"><datalist id="ll">${m.layanan.map(l=>`<option value="${esc(l)}">`).join('')}</datalist>
  <div class="row"><div><label>Jenis pasien</label><select name="jenis_pasien">${opts(['SEMUA'].concat(m.jenis),t.jenis_pasien)}</select></div><div><label>Kategori perujuk</label><select name="kategori">${opts(['SEMUA'].concat(m.kategori),t.kategori)}</select></div></div>
  <div class="row"><div><label>Tipe fee</label><select name="tipe">${opts([{v:'NOMINAL',l:'Nominal tetap (Rp)'},{v:'PERSEN',l:'Persentase (%) dari tagihan/klaim'}],t.tipe)}</select></div><div><label>Nilai</label><input name="nilai" type="number" step="any" min="0" required value="${esc(t.nilai)}"></div></div>
  <label>Status</label><select name="aktif">${opts([{v:'true',l:'Aktif'},{v:'false',l:'Nonaktif'}],t.aktif?'true':'false')}</select>
  <div class="row" style="margin-top:12px"><button class="btn">Simpan</button>${e?'<button type="button" class="btn bad" id="ht">Hapus</button>':''}<button type="button" class="btn sec" onclick="closeDlg()">Batal</button></div></form>`);
  if(e) $('#ht').onclick=async()=>{ if(!confirm('Hapus aturan fee "'+t.layanan+'" secara permanen? Fee rujukan yang sudah terverifikasi tidak berubah.')) return; try{ await api('tarifDelete',{id:t.id}); S.meta=null; closeDlg(); toast('Aturan dihapus'); mTarif(); }catch(x){ $('#de').innerHTML=err(x); } };
  $('#tf').onsubmit=async ev=>{ ev.preventDefault(); const o=fd(ev.target); o.aktif=o.aktif!=='false'; if(e) o.id=t.id; try{ await api('tarifSave',o); S.meta=null; closeDlg(); toast('Tersimpan'); mTarif(); }catch(x){ $('#de').innerHTML=err(x); } };
}
async function mAdmin(){
  const rows=await api('adminList');
  $('#mc').innerHTML=`<button class="btn" id="add" style="margin-bottom:10px">+ Tambah admin</button><div class="card">${rows.map(r=>`<div class="item"><div><b>${esc(r.nama)}</b> ${r.aktif?'':'<span class="badge b-bad">Nonaktif</span>'}<br><small>${esc(r.id)}</small></div><div class="r">${r.id!==S.user.id?`<button class="btn sec sm" data-r="${esc(r.id)}">Reset PIN</button> <button class="btn sec sm" data-t="${esc(r.id)}" data-a="${r.aktif}">${r.aktif?'Nonaktifkan':'Aktifkan'}</button>`:'<small class="muted">Akun Anda</small>'}</div></div>`).join('')}</div>
  <div class="card"><h3 style="margin-top:0">Ganti PIN saya</h3><div id="ce"></div><form id="cf"><label>PIN lama</label>${pw('name="old_pin" autocomplete="current-password"')}<label>PIN baru (6 angka)</label>${pw('name="new_pin" autocomplete="new-password"')}<div class="sp"></div><button class="btn sec">Ganti PIN</button></form></div>`;
  $('#add').onclick=()=>{ openDlg(`<h3 style="margin-top:0">Tambah admin</h3><div id="de"></div><form id="af"><label>ID (huruf kecil/angka, 3-20)</label><input name="id" required><label>Nama</label><input name="nama" required><div class="row" style="margin-top:12px"><button class="btn">Buat</button><button type="button" class="btn sec" onclick="closeDlg()">Batal</button></div></form>`);
    $('#af').onsubmit=async ev=>{ ev.preventDefault(); try{ const d=await api('adminCreate',fd(ev.target)); showPin(d.id,d.pin,'Admin dibuat'); mAdmin(); }catch(x){ $('#de').innerHTML=err(x); } }; };
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{ if(!confirm('Reset PIN '+b.dataset.r+'?')) return; try{ const d=await api('resetPin',{role:'ADMIN',id:b.dataset.r}); showPin(d.id,d.pin,'PIN direset'); }catch(x){ toast(x.message); } });
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{ try{ await api('adminToggle',{id:b.dataset.t,aktif:b.dataset.a!=='true'}); mAdmin(); }catch(x){ toast(x.message); } });
  $('#cf').onsubmit=async e=>{ e.preventDefault(); try{ await api('changePin',fd(e.target)); toast('PIN diganti'); e.target.reset(); $('#ce').innerHTML=''; }catch(x){ $('#ce').innerHTML=err(x); } };
}

/* ============ START ============ */
if (S.token && S.user) renderShell(); else renderLogin();
</script>
